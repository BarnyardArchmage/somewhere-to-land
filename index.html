<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#171320" />
    <meta name="color-scheme" content="dark" />
    <!-- Add-to-home-screen: open as a standalone app with no browser chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Somewhere To Land" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>Somewhere To Land</title>
    <style>
      html, body { margin: 0; padding: 0; background: #171320; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        /* Belt-and-braces with user-scalable=no: iOS ignores that meta for
           accessibility, but honours touch-action, so this is what actually
           stops double-tap zoom on the map. */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
